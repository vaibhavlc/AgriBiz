<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#f8fafc" />
    <script>
      (function() {
        try {
          const userTheme = localStorage.getItem('agribiz_user_theme');
          const savedSettings = sessionStorage.getItem('agribiz_settings') || localStorage.getItem('agribiz_settings');
          let theme = userTheme || 'system';
          if (!userTheme && savedSettings) {
            theme = JSON.parse(savedSettings).theme || 'system';
          }
          let active = 'light';
          if (theme === 'system') {
            active = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          } else {
            active = theme;
          }
          const themeColor = active === 'dark' ? '#0b0f19' : '#f8fafc';
          const metaTag = document.querySelector('meta[name="theme-color"]');
          if (metaTag) metaTag.setAttribute('content', themeColor);
          if (active === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.classList.add('dark-theme');
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.classList.remove('dark-theme');
          }
        } catch (e) {
          // ignore
        }
        try {
          if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
              navigator.serviceWorker.register('/sw.js').catch(function() {
                // ignore
              });
            });
          }
        } catch (e) {
          // ignore
        }
      })();
    </script>
    <link rel="manifest" id="app-manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <title>AgriBiz Trader Suite</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
