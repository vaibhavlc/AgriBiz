<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo-192.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AgriBiz" />
    <link rel="apple-touch-icon" href="/logo-192.png" />
    <script>
      (function() {
        try {
          const userTheme = localStorage.getItem('agribiz_user_theme');
          const savedSettings = sessionStorage.getItem('agribiz_settings') || localStorage.getItem('agribiz_settings');
          let theme = userTheme || 'system';
          if (!userTheme && savedSettings) {
            theme = JSON.parse(savedSettings).theme || 'system';
          }
          let active = 'light';
          if (theme === 'system') {
            active = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          } else {
            active = theme;
          }
          const themeColor = active === 'dark' ? '#0b0f19' : '#f8fafc';
          const metaTag = document.querySelector('meta[name="theme-color"]');
          if (metaTag) metaTag.setAttribute('content', themeColor);
          if (active === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.classList.add('dark-theme');
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.classList.remove('dark-theme');
          }
        } catch (e) {
          // ignore
        }
        try {
          if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
              navigator.serviceWorker.register('/sw.js').catch(function() {
                // ignore
              });
            });
          }
        } catch (e) {
          // ignore
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Mukta:wght@300;400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="manifest" id="app-manifest" href="/manifest.webmanifest" />
    <script>
      (function() {
        try {
          var savedComp = localStorage.getItem('agribiz_current_company');
          var compId = '';
          if (savedComp) {
            try { compId = JSON.parse(savedComp).id || ''; } catch (e) {}
          }
          var customName = (compId && localStorage.getItem('agribiz_pwa_custom_name_' + compId)) ||
                           localStorage.getItem('agribiz_pwa_custom_name');
          if (customName && customName.trim()) {
            var trimmedName = customName.trim().slice(0, 45);
            var manifestEl = document.getElementById('app-manifest');
            if (manifestEl) {
              manifestEl.href = '/manifest.webmanifest?name=' + encodeURIComponent(trimmedName);
            }
            var appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
            if (appleTitle) {
              appleTitle.content = trimmedName;
            }
          }
        } catch (e) {}
      })();
    </script>
    <title>AgriBiz</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
